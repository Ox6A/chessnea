name: Build executables

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: chessnea-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python environment
        run: |
          python --version
          python -m pip --version
          python -m pip check

      - name: Syntax check
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m compileall -q src tests

      - name: Type check with basedpyright
        run: |
          basedpyright

      - name: Run tests
        run: |
          PYTHONPATH=src python -m pytest -n auto -q