name: Build executables

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:                                                                                                                                                                                                           
    name: Run tests                                                                                                                                                                                               
    runs-on: ubuntu-latest                                                                                                                                                                                        
                                                                                                                                                                                                                  
    steps:                                                                                                                                                                                                        
      - name: Checkout repository                                                                                                                                                                                 
        uses: actions/checkout@v4                                                                                                                                                                                 
                                                                                                                                                                                                                  
      - name: Set up Python                                                                                                                                                                                       
        run: |                                                                                                                                                                                                    
          apt-get update                                                                                                                                                                                          
          apt-get install -y python3 python3-venv python3-pip                                                                                                                                                     
                                                                                                                                                                                                                  
      - name: Install dependencies                                                                                                                                                                                
        run: |                                                                                                                                                                                                    
          python3 -m venv .venv                                                                                                                                                                                   
          . .venv/bin/activate                                                                                                                                                                                    
          python -m pip install --upgrade pip                                                                                                                                                                     
          python -m pip install -r requirements-dev.txt                                                                                                                                                           
                                                                                                                                                                                                                  
      - name: Syntax check                                                                                                                                                                                        
        run: |                                                                                                                                                                                                    
          . .venv/bin/activate                                                                                                                                                                                    
          PYTHONDONTWRITEBYTECODE=1 python -m compileall -q src tests                                                                                                                                             

      - name: Type check with basedpyright                                                                                                                                                                        
        run: |                                                                                                                                                                                                    
          . .venv/bin/activate                                                                                                                                                                                    
          basedpyright

      - name: Run tests                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           
        run: |                                                                                                                                                                                                    
          . .venv/bin/activate                                                                                                                                                                                    
          PYTHONPATH=src python -m pytest -n auto -q 

  build-linux:
    name: Build Linux executable
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build tools
        run: |
          apt-get update
          apt-get install -y \
            python3 \
            python3-venv \
            python3-pip \
            libpython3.10 \
            file

      - name: Build Linux executable with PyInstaller
        run: |
          python3 -m venv .venv
          . .venv/bin/activate

          python -m pip install --upgrade pip
          python -m pip install pyinstaller

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          pyinstaller \
            --onefile \
            --name chessnea-linux-x86_64 \
            --paths src \
            --add-data "assets:assets" \
            src/main.py

          chmod +x dist/chessnea-linux-x86_64
          file dist/chessnea-linux-x86_64

      - name: Upload Linux executable artifact
        uses: actions/upload-artifact@v3
        with:
          name: chessnea-linux-x86_64
          path: dist/chessnea-linux-x86_64

  build-windows-wine:
    name: Build Windows executable with Wine
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wine and tools
        run: |
          apt-get update
          apt-get install -y \
            wine64 \
            wget \
            xvfb \
            unzip \
            file

      - name: Set Wine environment
        run: |
          echo "WINEPREFIX=$PWD/.wine" >> "$GITHUB_ENV"
          echo "WINEARCH=win64" >> "$GITHUB_ENV"
          echo "WINEDEBUG=-all" >> "$GITHUB_ENV"

      - name: Initialise Wine
        run: |
          xvfb-run -a wineboot --init || true
          sleep 5

      - name: Download embeddable Windows Python
        run: |
          wget -O python-embed.zip https://www.python.org/ftp/python/3.10.11/python-3.10.11-embed-amd64.zip
          mkdir -p winpython
          unzip python-embed.zip -d winpython

      - name: Enable site-packages for embeddable Python
        run: |
          sed -i 's/^#import site/import site/' winpython/python310._pth

      - name: Install pip for embeddable Python
        run: |
          wget -O get-pip.py https://bootstrap.pypa.io/get-pip.py
          xvfb-run -a wine winpython/python.exe get-pip.py

      - name: Install Windows Python packages
        run: |
          xvfb-run -a wine winpython/python.exe -m pip install --upgrade pip
          xvfb-run -a wine winpython/python.exe -m pip install pyinstaller

          if [ -f requirements.txt ]; then
            xvfb-run -a wine winpython/python.exe -m pip install -r requirements.txt
          fi

      - name: Build Windows executable with PyInstaller
        run: |
          xvfb-run -a wine winpython/Scripts/pyinstaller.exe \
            --onefile \
            --name chessnea-windows-x86_64 \
            --paths src \
            --add-data "assets;assets" \
            src/main.py

          mkdir -p dist/windows
          cp dist/chessnea-windows-x86_64.exe dist/windows/chessnea-windows-x86_64.exe
          file dist/windows/chessnea-windows-x86_64.exe || true

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v3
        with:
          name: chessnea-windows-x86_64
          path: dist/windows/chessnea-windows-x86_64.exe

  release:
    name: Publish Forgejo release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows-wine
    if: startsWith(forgejo.ref, 'refs/tags/v')

    steps:
      - name: Download Linux executable
        uses: actions/download-artifact@v3
        with:
          name: chessnea-linux-x86_64
          path: release

      - name: Download Windows executable
        uses: actions/download-artifact@v3
        with:
          name: chessnea-windows-x86_64
          path: release

      - name: List release files
        run: |
          ls -lah release

      - name: Publish release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          release-dir: release
          token: ${{ forgejo.token }}